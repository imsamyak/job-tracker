spring.datasource.url=jdbc:h2:mem:testdb
spring.jpa.hibernate.ddl-auto=update
# the background worker stays quiet in tests; tests call the processor directly
jobtracker.intake.poll-ms=86400000
jobtracker.resume.dir=target/test-uploads/resume
jobtracker.secret.key-file=target/test-secret.key
jobtracker.mail.sync-ms=86400000
jobtracker.mail.initial-delay-ms=86400000
