spring.application.name=JTraker

# Embedded, file-based H2 - data written to ./data/jtraker.mv.db, survives restarts.
spring.datasource.url=jdbc:h2:./data/jtraker
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Keep existing tables/data between runs; only add new columns/tables as entities change.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Optional: browse the file DB at http://localhost:8080/h2-console while the app is running.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Folder that gets one sub-folder per job: [Company]_[Role]_[JobId], each holding the resume and the
# job description PDF. Was "/generated" (an absolute Windows root path, not the project's own folder) -
# fixed to a project-relative path.
spring.generated.path=./generated

# Resume generation
jtraker.resume.font-dir=C:/Windows/Fonts
# How many resumes are rendered at the same time.
jtraker.resume.parallelism=4
jtraker.resume.schedule-initial-delay=PT10S
jtraker.resume.schedule-delay=PT30S

# Job intake: two-phase, so POST /api/jobs/intake (and so the extension) never waits on Claude.
# Phase 1 (instant): the posting's PDF is saved under jtraker.intake.pending-dir and a PendingIntake row
# is created. Phase 2 (background, IntakeScheduler): reads it with the Claude Code CLI (claude -p), on
# the user's own subscription, not a metered API key.
# pending-dir is project-relative (not the OS temp dir), so a posting survives an app restart while
# waiting to be read.
# How Claude reads a posting during intake:
#   text = pull the text out of the PDF locally and send Claude only that text (no PDF-reading tool, far
#          fewer tokens). A PDF that yields almost no text (scanned/image-only) falls back to "pdf" for that
#          one posting.
#   pdf  = let Claude read the PDF itself (the original behaviour). Switch back by changing this line and
#          restarting - nothing else needs to change.
# Each call is logged to data/ai-usage.jsonl as "intake-text" or "intake", so the two can be compared.
jtraker.intake.mode=text

# Keyword-rules pilot: alongside every live Claude intake, also run the keyword rules on the posting's text
# and record how well they agree, per field, in the extraction_comparison table (read it in /h2-console).
# Free - Claude's answer already exists. Changes nothing intake saves. POST /api/pilot/rules/backtest does
# the same over jobs already stored. Optionally point keywords-file at an external copy of
# src/main/resources/pilot/keywords.json to tune it without rebuilding.
jtraker.pilot.shadow-rules=true
#jtraker.pilot.keywords-file=./keywords.json
jtraker.intake.pending-dir=./pending-intakes
jtraker.intake.parallelism=3
jtraker.intake.schedule-initial-delay=PT5S
jtraker.intake.schedule-delay=PT15S
# Full path avoids depending on PATH; see .local/bin under the Windows user profile.
jtraker.claude.executable=${user.home}/.local/bin/claude.exe
jtraker.claude.model=claude-haiku-4-5-20251001
# Hard cap per extraction call, as a safety net regardless of how usage is billed.
jtraker.claude.max-budget-usd=0.50
jtraker.claude.timeout=PT2M
# Page text longer than this is truncated before being sent (the PDF stays the primary source).
jtraker.claude.max-page-text-chars=20000

# The extension's PDF upload can be a few MB.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
