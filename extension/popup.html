<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>JTracker</title>
    <style>
        body {
            width: 300px;
            margin: 0;
            padding: 14px;
            font: 14px/1.4 system-ui, sans-serif;
            color: #1a1a1a;
            background: #fff;
        }
        h1 {
            font-size: 15px;
            margin: 0 0 10px;
        }
        #status {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        #status.error { color: #b00020; }
        #status.ok { color: #16632f; }
        .spinner {
            width: 14px;
            height: 14px;
            margin-top: 2px;
            border: 2px solid #ccc;
            border-top-color: #666;
            border-radius: 50%;
            flex: none;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        button {
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #f7f7f7;
            cursor: pointer;
        }
        #retry[hidden] { display: none; }
    </style>
</head>
<body>
    <h1>JTracker</h1>
    <div id="status"><span class="spinner"></span><span>Starting…</span></div>
    <button id="retry" hidden>Try again</button>
    <script src="popup.js"></script>
</body>
</html>
