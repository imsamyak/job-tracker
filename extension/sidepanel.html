<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>JTracker</title>
    <style>
        :root {
            color-scheme: dark;
        }
        * {
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            display: flex;
            flex-direction: column;
            font: 13px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;
            background: #0b0d12;
            color: #e4e7ec;
        }
        #bar {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid #232733;
        }
        #bar h1 {
            font-size: 12.5px;
            font-weight: 600;
            margin: 0;
            letter-spacing: 0.02em;
        }
        #bar-actions {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        #save, #refresh {
            border: 1px solid #232733;
            background: #1a1e28;
            color: #e4e7ec;
            border-radius: 6px;
            padding: 0.3rem;
            line-height: 0;
            cursor: pointer;
        }
        #save:hover, #refresh:hover {
            background: #232838;
        }
        #save:disabled {
            opacity: 0.55;
            cursor: default;
        }
        #save.is-done {
            border-color: #2a4270;
            background: #16233d;
            color: #5b8def;
        }
        #save.is-error {
            border-color: #4a2323;
            background: #2b1717;
            color: #f56565;
        }
        #save .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #3a4152;
            border-top-color: #e4e7ec;
            border-radius: 50%;
            display: block;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #status-strip {
            flex: none;
            display: none;
            align-items: center;
            gap: 0.5rem;
            padding: 0.45rem 0.75rem;
            font-size: 11.5px;
            border-bottom: 1px solid #232733;
            color: #8b93a1;
        }
        #status-strip.visible {
            display: flex;
        }
        #status-strip.error {
            color: #f56565;
        }
        #status-strip.done {
            color: #5b8def;
        }
        #frame-wrap {
            flex: 1;
            position: relative;
            min-height: 0;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
        }
        #offline {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 1.5rem;
            text-align: center;
            color: #8b93a1;
        }
        #offline.visible {
            display: flex;
        }
        #offline p {
            margin: 0;
            font-size: 12.5px;
        }
        #offline button {
            padding: 0.4rem 0.9rem;
            border: 1px solid #232733;
            border-radius: 6px;
            background: #1a1e28;
            color: #e4e7ec;
            cursor: pointer;
            font: inherit;
        }
        #offline button:hover {
            background: #232838;
        }
    </style>
</head>
<body>
    <div id="bar">
        <h1>JTracker</h1>
        <div id="bar-actions">
            <button id="save" title="Save this page to JTracker" aria-label="Save this page to JTracker">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z" />
                    <path d="M17 21v-8H7v8" />
                    <path d="M7 3v5h8" />
                </svg>
            </button>
            <button id="refresh" title="Refresh" aria-label="Refresh">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                    <path d="M21 3v6h-6" />
                </svg>
            </button>
        </div>
    </div>
    <div id="status-strip"></div>
    <div id="frame-wrap">
        <!-- clipboard-write: the app's copy buttons (referral note, links, role description, folder path)
             use navigator.clipboard.writeText - without this, Chrome's default Permissions-Policy blocks
             the Clipboard API inside an iframe entirely (silently, or with a permissions-policy error),
             which is exactly what was happening here. -->
        <iframe id="app" title="JTracker" allow="clipboard-write"></iframe>
        <div id="offline">
            <p>JTracker isn't running — start the app, then retry.</p>
            <button id="retry">Retry</button>
        </div>
    </div>
    <script src="sidepanel.js"></script>
</body>
</html>
